<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pleex</title>
<link rel="stylesheet" href="app/styles.css">
</head>
<body>

<!-- Library browser -->
<div id="browse">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span>Pleex</span>
    </div>
    <div class="topbar-actions">
      <input id="search" type="search" placeholder="Search episodes…" autocomplete="off" spellcheck="false">
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5zm7.4-2.6l2 1.6-2 3.4-2.4-1a7.6 7.6 0 0 1-1.7 1l-.4 2.6h-4l-.4-2.6a7.6 7.6 0 0 1-1.7-1l-2.4 1-2-3.4 2-1.6a7.7 7.7 0 0 1 0-2l-2-1.6 2-3.4 2.4 1a7.6 7.6 0 0 1 1.7-1L10.5 3h4l.4 2.6a7.6 7.6 0 0 1 1.7 1l2.4-1 2 3.4-2 1.6a7.7 7.7 0 0 1 0 2z"/></svg>
      </button>
    </div>
  </header>

  <main id="content"></main>
</div>

<!-- Player -->
<div id="player" class="hidden" tabindex="-1">
  <video id="video" playsinline preload="metadata"></video>
  <audio id="altaudio" preload="auto"></audio>

  <div id="subtitles" class="subtitles"></div>

  <div id="player-ui">
    <div class="player-top">
      <button id="btn-back" class="icon-btn" title="Back to library (Esc)" aria-label="Back to library">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <div class="player-title">
        <strong id="pt-title">—</strong>
        <span id="pt-sub"></span>
      </div>
    </div>

    <button id="big-play" class="big-play hidden" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <div class="player-bottom">
      <div class="scrub" id="scrub">
        <div class="scrub-hit"></div>
        <div class="scrub-track">
          <div class="scrub-buffer" id="scrub-buffer"></div>
          <div class="scrub-played" id="scrub-played"></div>
          <div class="scrub-knob" id="scrub-knob"></div>
        </div>
        <div class="scrub-tip" id="scrub-tip">0:00</div>
      </div>

      <div class="controls">
        <button id="btn-play" class="icon-btn" title="Play/Pause (Space)" aria-label="Play or pause">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause hidden" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button id="btn-back10" class="icon-btn skip" title="Back 10s (←)" aria-label="Back 10 seconds">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          <span>10</span>
        </button>
        <button id="btn-fwd30" class="icon-btn skip flip" title="Forward 30s (→)" aria-label="Forward 30 seconds">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          <span>30</span>
        </button>

        <div class="vol">
          <button id="btn-mute" class="icon-btn" title="Mute (M)" aria-label="Mute">
            <svg class="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.5 7.5 0 0 1 0 15.4v2.1a9.5 9.5 0 0 0 0-19.6z"/></svg>
            <svg class="i-muted hidden" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.4-1L20 6.6 17.6 9 15.2 6.6 13.8 8l2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4-2.4-2.4z"/></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>

        <div class="time"><span id="t-cur">0:00</span> <span class="sep">/</span> <span id="t-dur">0:00</span></div>

        <div class="spacer"></div>

        <div class="menu-wrap">
          <button id="btn-audio" class="icon-btn" title="Audio language" aria-label="Audio language">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v5a3 3 0 0 0 3 3h2v-8H5v0a7 7 0 0 1 14 0v0h-3v8h2a3 3 0 0 0 3-3v-5a9 9 0 0 0-9-9z"/></svg>
          </button>
          <div id="menu-audio" class="menu hidden"></div>
        </div>

        <div class="menu-wrap">
          <button id="btn-subs" class="icon-btn" title="Subtitles (C)" aria-label="Subtitles">
            <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM6 12h4v2H6zm0 4h8v-2H6zm12 0h-2v-2h2zm0-4h-6v-2h6z"/></svg>
          </button>
          <div id="menu-subs" class="menu hidden"></div>
        </div>

        <div class="menu-wrap">
          <button id="btn-rate" class="icon-btn text-btn" title="Playback speed" aria-label="Playback speed">1×</button>
          <div id="menu-rate" class="menu hidden"></div>
        </div>

        <button id="btn-next" class="icon-btn" title="Next episode (N)" aria-label="Next episode">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="btn-fs" class="icon-btn" title="Fullscreen (F)" aria-label="Fullscreen">
          <svg class="i-fs" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm0-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg>
          <svg class="i-fsx hidden" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5zm3-8H5v2h5V5H8zm6 11h2v-3h3v-2h-5zm2-11V5h-2v5h5V8z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Skip intro / credits. Outside #player-ui so it survives the idle fade. -->
  <button id="btn-skip" class="skip-marker hidden">
    <span id="skip-label">Skip Intro</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
  </button>

  <!-- Up-next countdown -->
  <div id="nextup" class="nextup hidden">
    <div class="nextup-card">
      <div class="nextup-still"><img id="nu-img" alt=""></div>
      <div class="nextup-body">
        <div class="nextup-label">Up next</div>
        <div class="nextup-title" id="nu-title">—</div>
        <div class="nextup-meta" id="nu-meta"></div>
        <div class="nextup-actions">
          <button id="nu-play" class="btn primary">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            Play now
          </button>
          <button id="nu-cancel" class="btn">Cancel</button>
        </div>
      </div>
      <svg class="nextup-ring" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="ring-bg" cx="22" cy="22" r="19"></circle>
        <circle class="ring-fg" id="nu-ring" cx="22" cy="22" r="19"></circle>
      </svg>
      <div class="nextup-count" id="nu-count">10</div>
    </div>
  </div>

  <!-- Transient toast, e.g. "Resumed from 12:34" -->
  <div id="toast" class="toast hidden"></div>
</div>

<!-- Settings dialog -->
<div id="settings" class="modal hidden">
  <div class="modal-card">
    <h2>Settings</h2>

    <label class="row">
      <span>Autoplay next episode</span>
      <input type="checkbox" id="set-autoplay">
    </label>

    <label class="row">
      <span>Countdown before autoplay</span>
      <select id="set-countdown">
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
        <option value="15">15 seconds</option>
        <option value="30">30 seconds</option>
      </select>
    </label>

    <label class="row">
      <span>Subtitle size</span>
      <select id="set-subsize">
        <option value="0.8">Small</option>
        <option value="1">Normal</option>
        <option value="1.3">Large</option>
        <option value="1.7">Extra large</option>
      </select>
    </label>

    <label class="row">
      <span>Remember playback position</span>
      <input type="checkbox" id="set-resume">
    </label>

    <label class="row">
      <span>Offer to skip intros and credits</span>
      <input type="checkbox" id="set-skip">
    </label>

    <label class="row">
      <span>Skip intros without asking</span>
      <input type="checkbox" id="set-autoskip">
    </label>

    <hr>

    <p class="hint">
      Watch history lives in this browser's local storage. Export it to a file
      to carry it with the drive, or to move it to another machine.
    </p>
    <div class="row buttons">
      <button id="btn-export" class="btn">Export history</button>
      <button id="btn-import" class="btn">Import history</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
    <div class="row buttons">
      <button id="btn-reset" class="btn danger">Reset all watch history</button>
    </div>

    <div class="modal-close">
      <button id="btn-close-settings" class="btn primary">Done</button>
    </div>
  </div>
</div>

<script>
// Browsers cache file:// URLs hard, which would leave the page showing a stale
// library after re-running the indexer. A timestamp query defeats that, and it
// is honoured for file:// as well as http://.
(function () {
  window.PLEEX = { subs: {}, bust: '?v=' + Date.now() };
  function loadApp() {
    var a = document.createElement('script');
    a.src = 'app/app.js' + window.PLEEX.bust;
    document.head.appendChild(a);
  }
  var s = document.createElement('script');
  s.src = 'library.js' + window.PLEEX.bust;
  s.onload = loadApp;
  s.onerror = function () { window.PLEEX_LIBRARY_MISSING = true; loadApp(); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
